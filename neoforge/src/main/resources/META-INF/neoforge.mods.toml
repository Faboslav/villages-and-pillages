modLoader = "javafml"
loaderVersion = "*"
license = "CC-BY-NC-ND-4.0"
issueTrackerURL = "https://github.com/Faboslav/villages-and-pillages/issues"

[[mods]]
modId = "${modId}"
version = "${modVersion}"
displayName = "${modName}"
authors = "${modAuthor}"
description = "${modDescription}"
#? if >= 26.3 {
iconFile = "icon.png"
bannerFile = "icon.png"
#?} else {
#logoFile = "icon.png"
#?}
logoBlur = false
displayURL = "https://www.curseforge.com/minecraft/mc-mods/villages-and-pillages"

[[mixins]]
config = "${modId}-common.mixins.json"

[[dependencies.${ modId }]]
modId = "neoforge"
type = "required"
versionRange = "*"
ordering = "NONE"
side = "BOTH"

[[dependencies.${ modId }]]
modId = "minecraft"
required = true
versionRange = "[${minMinecraftVersion},)"
ordering = "NONE"
side = "BOTH"